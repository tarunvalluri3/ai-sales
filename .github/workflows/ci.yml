name: CI

# Phase 20 (STATE.md / docs/phases.md): gates every PR and every push to
# main on lint + typecheck + build + the pgTAP tenant-isolation suite,
# the last of which now runs against the isolated ai-sales-staging
# Supabase project (never production) via a service-account access
# token, closing the gap flagged in Phase 19's audit (npm test used to
# require a human's locally-linked CLI session and always targeted
# whichever project that session happened to be linked to).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # One global lane, not per-ref: every run touches the same shared
  # ai-sales-staging database (see the "known limitation" note below),
  # so two runs must never execute the migration-push step at once.
  group: ci-shared-staging-db
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.STAGING_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_CHAT_MODEL: ${{ secrets.GEMINI_CHAT_MODEL }}
      GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL }}
      GEMINI_EMBEDDING_DIMENSION: ${{ secrets.GEMINI_EMBEDDING_DIMENSION }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Plan pricing / GST arithmetic tests
        # Phase 17a: prices are GST-inclusive and the taxable/CGST/SGST/IGST
        # split is derived from them (lib/plans.ts). Money-and-tax arithmetic
        # that appears on invoices must not be breakable without CI failing.
        # Pure functions, no database or secrets, so it runs ahead of the
        # build. Deliberately its own step: `npm test` stays the pgTAP suite.
        run: npm run test:plan-tax

      - name: Razorpay signature and webhook lifecycle tests
        # Phase 17b: app/api/webhooks/razorpay/route.ts is the one endpoint
        # in this codebase where a verification bug is directly
        # monetisable -- a forged `subscription.charged` would grant a Scale
        # plan for free. These cover all three HMAC forms (the two Checkout
        # callbacks and the webhook, whose field orders differ), plus the
        # idempotency case: the same charge event twice extends the period
        # once. Pure modules, no database and no secrets, so it runs
        # alongside the GST tests rather than with the pgTAP suite.
        run: npm run test:razorpay

      - name: GST invoice, credit note and PDF tests
        # Phase 17c: invoices are legal records. This covers the IST
        # financial-year boundary (31 March / 1 April, both sides), GSTIN
        # check digits, taxable + tax = gross to the paisa for every plan in
        # both tax layouts, idempotent issuing (a payment replayed is one
        # invoice), credit notes that may never exceed their invoice, the
        # supplier-config refusal, and the PDF itself -- the rupee glyph,
        # Indian digit grouping, long names -- extracted back out of the
        # rendered file. Pure modules, no database and no secrets. (The
        # database half -- the counter lock, immutability, the cannot-exceed
        # trigger -- is pgTAP files 050 and 051, run against staging below.)
        run: npm run test:invoices

      - name: Onboarding readiness rule tests
        # feat/onboarding-readiness: the rules that decide whether a business
        # may publish its AI for the first time (lib/onboarding-readiness.ts).
        # A regression here could either let an empty business go live in front
        # of real prospects, or wrongly block a legitimately-ready one. Pure
        # functions, no database or secrets, so it runs with the other unit
        # tests ahead of the build. (The new table's tenant isolation is pgTAP
        # file 052, run against staging below.)
        run: npm run test:onboarding-readiness

      - name: Chat pipeline latency-pass tests
        # 2026-10-22 latency pass (STATE.md): the search-dedupe guard
        # (lib/chat-query-dedupe.ts) and the AI deadline ordering invariants
        # (lib/chat-timeouts.ts). Pure modules, no database and no secrets,
        # so it runs alongside the other unit suites rather than with pgTAP.
        run: npm run test:chat-perf

      - name: Chat streaming transport and assembly tests
        # feat/chat-streaming (STATE.md): the SSE wire codec (lib/chat-stream.ts),
        # the widget's many-chunks-into-one-bubble reducer
        # (lib/widget-stream-reducer.ts) and the iframe<->loader protocol
        # validator. Pure modules, no database and no secrets, so it runs
        # with the other unit suites. (The model streaming, DB writes,
        # escalation and tenant isolation are covered by the eval's shared
        # pipeline and by pgTAP; this guards the transport that can silently
        # hand a visitor a broken bubble.)
        run: npm run test:chat-streaming

      - name: Abuse rate-limit logic tests
        # Phase 32 (STATE.md): the pure core of the abuse rate-limit scopes
        # (lib/abuse-limits.ts) -- trial-vs-normal burst profile selection, the
        # log-only/fail-open verdict, the IPv4 /24 derivation (and IPv6 skip)
        # and the new-conversation predicate. Pure module, no database and no
        # secrets, so it runs with the other unit suites. (The DB check
        # constraint and zero-grant posture are pgTAP file 054, run against
        # staging below.)
        run: npm run test:abuse-limits

      - name: Guardrail logic tests
        # Guardrails Phase 1 (STATE.md): the pure input guardrails in
        # lib/guardrails/ -- sanitising, sensitive-number masking, the
        # multilingual injection/abuse classifier, and the wiring checks that
        # every channel routes the raw message through prepareProspectMessage.
        # Pure modules, no database and no secrets. (guardrail_events RLS is
        # pgTAP file 057, run against staging below.)
        run: npm run test:guardrails

      - name: Instant-answer decision logic tests
        # Instant answers (STATE.md 2026-10-28): greeting detection, the
        # eligibility rules (self-contained, language/script, injection
        # signals), catalog-question matching, the FAQ similarity / gap /
        # lexical-guard thresholds, and the output checks on stored answers.
        # A wrong instant answer (especially a wrong price) is the failure
        # this guards against. Pure modules with injected lookups, so no
        # database and no secrets. (Staleness via the content version, tenant
        # isolation and the zero-grant posture are pgTAP file 056, run
        # against staging below.)
        run: npm run test:answer-bank

      - name: Tool scope and write-cap tests
        # Guardrails Phase 3 (STATE.md): every AI tool is scoped to its business,
        # no tool can fetch a URL, contacts passed to write tools are verified
        # against what the visitor typed, and the write caps are wired before
        # each write. Needs --conditions=react-server (the executors are
        # server-only). No database and no secrets.
        run: npm run test:tool-scope

      - name: Output guardrail tests
        # Guardrails Phase 4 (STATE.md): the canary / verbatim-prompt leak block,
        # the unlisted link/email/phone filter, the unbacked-promise detector and
        # the StreamOutputGuard (hold-back, mid-stream retract), plus the widget
        # retract wiring. Pure modules, no network and no secrets.
        run: npm run test:output-guard

      - name: Guardrail response-path tests
        # Guardrails Phase 5 (STATE.md): the enforcing response policy (fixed safe
        # reply + handover, repeated-abuse cut-off), the owner-facing flag labels,
        # and the wiring in the widget route, WhatsApp and Instagram. Pure modules,
        # no database and no secrets.
        run: npm run test:guardrail-response

      - name: Eval judge tests
        # Guardrails Phase 6 (STATE.md): the red-team eval catalog and judges
        # (scripts/eval-judges.mjs). Proves each judge FAILS the reply an attacker
        # wanted (several are replies the real model gave in the Phase 0 red-team)
        # and passes a correct refusal, so the red-team score cannot silently pass
        # everything. Pure and free: no model, no database. The live red-team run
        # itself is `npm run eval:redteam` (manual, like npm run eval).
        run: npm run test:eval-judges

      - name: Build
        run: npm run build

      - name: Sync staging database schema
        # Keeps ai-sales-staging's schema current with this branch's
        # migrations before the pgTAP suite runs against it, and also
        # verifies every migration file applies cleanly from scratch on
        # a real (non-local, non-Docker) Postgres instance.
        #
        # Known limitation: ai-sales-staging is one shared database, not
        # a fresh instance per PR (Supabase's per-PR preview-branching
        # feature needs a paid project tier, deliberately not adopted --
        # see STATE.md's Phase 20 backups/tier decision). Two PRs with
        # migrations open at once can race against this same database.
        # Acceptable for a single-developer project today; revisit
        # (branching, or serializing this job) before a second
        # contributor lands concurrent migration PRs.
        run: npx supabase link --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_REF }} --password ${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}
             && npx supabase db push --linked --yes

      - name: Tenant-isolation tests (pgTAP, against staging)
        run: npm test
